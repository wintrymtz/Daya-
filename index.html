<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Cumpleaños!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 450px;
      width: 100%;
      animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    .cake {
      font-size: 80px;
      margin-bottom: 10px;
      display: inline-block;
      animation: bounce 2s infinite;
    }

    h1 {
      color: #ff4757;
      font-size: 2.2rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 25px;
    }

    .btn {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }

    .btn:hover {
      background-color: #e84118;
      transform: translateY(-2px);
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      color: #2ed573;
      font-size: 1.2rem;
      display: none;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="cake">🎂</div>
    <h1>¡Feliz Cumpleaños!</h1>
    <p>Te deseo un día lleno de alegría, risas, sorpresas y momentos inolvidables. ¡Que todos tus deseos se cumplan este año!</p>
    
    <button class="btn" onclick="celebrate()">¡Haz clic para celebrar!</button>
    <div id="message">🎉 ¡Que tengas el mejor día de todos! 🥳</div>
  </div>

  <script>
    function celebrate() {
      const msg = document.getElementById('message');
      msg.style.display = 'block';
      alert('🎈 ¡Muchas felicidades! 🎁');
    }
  </script>

</body>
</html>
